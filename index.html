<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Tim Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <div id="namePanel">
    <h2>Enter name</h2>
    <input id="nameInput" placeholder="Your name">
    <button id="saveName">Start</button>
  </div>

  <div id="game" class="hidden">

    <header>
      <div>Player: <b id="playerName"></b></div>
      <div>Tims: <b id="tims">0</b></div>
      <div>CPS: <b id="cps">0</b></div>
      <div>Rebirths: <b id="rebirths">0</b></div>
    </header>

    <img id="timImage" src="assets/skins/default.png" alt="Tim">

    <button id="rebirthBtn">REBIRTH</button>

    <h3>Upgrades</h3>
    <div id="upgradeShop"></div>

    <h3>Skins</h3>
    <div id="skinShop"></div>

    <h3>Music</h3>
    <div id="musicShop"></div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
