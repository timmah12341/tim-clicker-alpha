<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Tim Clicker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <h1>Tim Clicker</h1>

  <img id="mainImage" src="assets/skins/default.png" />

  <div class="stats">
    <div>Cookies: <span id="cookies">0</span></div>
    <div>CPS: <span id="cps">0</span></div>
    <div>Rebirths: <span id="rebirths">0</span></div>
  </div>

  <button id="clickBtn">CLICK</button>
  <button id="rebirthBtn">REBIRTH</button>

  <h2>Upgrades</h2>
  <div id="upgrades"></div>

  <h2>Skins</h2>
  <div id="skins"></div>

  <h2>Music</h2>
  <div id="music"></div>

  <h2>Crypto</h2>
  <div id="crypto"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
